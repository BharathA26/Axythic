<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page Not Found | Axythic</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #020617;
        color: #fff;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      main {
        max-width: 34rem;
        text-align: center;
      }
      p:first-child {
        color: #60a5fa;
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      h1 {
        margin: 1rem 0 0;
        font-size: clamp(2.5rem, 8vw, 4rem);
      }
      p {
        color: #cbd5e1;
        font-size: 1.125rem;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 1.25rem;
        padding: 0.8rem 1.25rem;
        border-radius: 0.75rem;
        background: #2563eb;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Error 404</p>
      <h1>Page not found</h1>
      <p>The address may be incorrect, or the page may have moved.</p>
      <a href="/">Return to Axythic</a>
    </main>
  </body>
</html>
