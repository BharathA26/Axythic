<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page Not Found | Axythic</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #030303;
        color: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 85% 15%, rgba(79, 70, 229, 0.2), transparent 34rem),
          radial-gradient(circle at 10% 90%, rgba(37, 99, 235, 0.14), transparent 32rem),
          #030303;
      }
      header,
      footer {
        width: min(72rem, calc(100% - 3rem));
        margin: 0 auto;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 5rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      }
      .brand {
        color: #fff;
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        text-decoration: none;
      }
      .contact {
        color: #a5b4fc;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
      }
      main {
        min-height: calc(100vh - 10rem);
        display: grid;
        place-items: center;
        width: min(46rem, calc(100% - 3rem));
        margin: 0 auto;
        padding: 5rem 0;
        text-align: center;
      }
      .eyebrow {
        margin: 0;
        color: #60a5fa;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }
      h1 {
        margin: 1.25rem 0 0;
        font-size: clamp(2.8rem, 9vw, 5rem);
        line-height: 1.02;
        letter-spacing: -0.055em;
      }
      .message {
        max-width: 36rem;
        margin: 1.5rem auto 0;
        color: #a1a1aa;
        font-size: 1.1rem;
        line-height: 1.75;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.9rem;
        margin-top: 2rem;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        padding: 0.75rem 1.35rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      .button-primary {
        border-color: transparent;
        background: linear-gradient(90deg, #2563eb, #4f46e5);
      }
      footer {
        min-height: 5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        border-top: 1px solid rgba(255, 255, 255, 0.09);
      }
      footer a {
        color: #a1a1aa;
        font-size: 0.85rem;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #60a5fa;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/">Axythic</a>
      <a class="contact" href="/contact">Contact</a>
    </header>
    <main>
      <div>
        <p class="eyebrow">Error 404</p>
        <h1>This page could not be found.</h1>
        <p class="message">
          The address may be incorrect, or the page may have moved. Return to
          the homepage or contact Axythic if you need help finding something.
        </p>
        <div class="actions">
          <a class="button button-primary" href="/">Return home</a>
          <a class="button" href="/contact">Contact Axythic</a>
        </div>
      </div>
    </main>
    <footer>
      <a href="/privacy-policy">Privacy Policy</a>
      <a href="/terms">Terms &amp; Conditions</a>
    </footer>
  </body>
</html>
